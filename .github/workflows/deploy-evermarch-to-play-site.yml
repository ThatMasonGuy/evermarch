name: Deploy Evermarch to Play Site

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Validate and notify play.tempeststudios.com.au
    runs-on: ubuntu-latest

    steps:
      - name: Check out Evermarch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Evermarch build
        run: npm run build -- --base=/evermarch/app/

      - name: Check dispatch token
        env:
          PLAY_SITE_DISPATCH_TOKEN: ${{ secrets.PLAY_SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$PLAY_SITE_DISPATCH_TOKEN" ]; then
            echo "::error::Missing PLAY_SITE_DISPATCH_TOKEN secret."
            echo "Create a fine-grained GitHub token that can dispatch workflows in ThatMasonGuy/play-tempest-studios."
            exit 1
          fi

      - name: Dispatch play-site rebuild
        env:
          PLAY_SITE_DISPATCH_TOKEN: ${{ secrets.PLAY_SITE_DISPATCH_TOKEN }}
          GAME_SHA: ${{ github.sha }}
          GAME_REF: ${{ github.ref_name }}
          GAME_REPOSITORY: ${{ github.repository }}
          GAME_RUN_ID: ${{ github.run_id }}
          PLAY_SITE_REPOSITORY: ThatMasonGuy/play-tempest-studios
        run: |
          cat > payload.json <<JSON
          {
            "event_type": "external-game-updated",
            "client_payload": {
              "game": "evermarch",
              "repository": "$GAME_REPOSITORY",
              "ref": "$GAME_REF",
              "sha": "$GAME_SHA",
              "run_id": "$GAME_RUN_ID"
            }
          }
          JSON

          curl --fail-with-body \
            --request POST \
            --url "https://api.github.com/repos/$PLAY_SITE_REPOSITORY/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $PLAY_SITE_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @payload.json

          {
            echo "### Play site rebuild requested"
            echo ""
            echo "- Game: \`evermarch\`"
            echo "- Repository: \`$GAME_REPOSITORY\`"
            echo "- Ref: \`$GAME_REF\`"
            echo "- Commit: \`$GAME_SHA\`"
            echo "- Target: \`$PLAY_SITE_REPOSITORY\`"
          } >> "$GITHUB_STEP_SUMMARY"
