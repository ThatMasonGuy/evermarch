name: Publish Evermarch Updates to Play Site

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Validate updates and notify play.tempeststudios.com.au
    runs-on: ubuntu-latest

    steps:
      - name: Check out Evermarch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Evermarch updates
        run: npm run validate:updates

      - name: Check dispatch token
        env:
          PLAY_SITE_DISPATCH_TOKEN: ${{ secrets.PLAY_SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$PLAY_SITE_DISPATCH_TOKEN" ]; then
            echo "::error::Missing PLAY_SITE_DISPATCH_TOKEN secret."
            echo "Create a fine-grained GitHub token that can dispatch workflows in ThatMasonGuy/play-tempest-studios."
            exit 1
          fi

      - name: Dispatch play-site update publish
        env:
          PLAY_SITE_DISPATCH_TOKEN: ${{ secrets.PLAY_SITE_DISPATCH_TOKEN }}
          UPDATE_SHA: ${{ github.sha }}
          UPDATE_REF: ${{ github.ref_name }}
          UPDATE_REPOSITORY: ${{ github.repository }}
          UPDATE_RUN_ID: ${{ github.run_id }}
          PLAY_SITE_REPOSITORY: ThatMasonGuy/play-tempest-studios
        run: |
          cat > payload.json <<JSON
          {
            "event_type": "evermarch-updates-updated",
            "client_payload": {
              "repository": "$UPDATE_REPOSITORY",
              "ref": "$UPDATE_REF",
              "sha": "$UPDATE_SHA",
              "updates_ref": "$UPDATE_SHA",
              "run_id": "$UPDATE_RUN_ID"
            }
          }
          JSON

          curl --fail-with-body \
            --request POST \
            --url "https://api.github.com/repos/$PLAY_SITE_REPOSITORY/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $PLAY_SITE_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @payload.json

          {
            echo "### Play-site update publish requested"
            echo ""
            echo "- Repository: \`$UPDATE_REPOSITORY\`"
            echo "- Ref: \`$UPDATE_REF\`"
            echo "- Update commit: \`$UPDATE_SHA\`"
            echo "- Target: \`$PLAY_SITE_REPOSITORY\`"
            echo "- The playable Evermarch deployment lock is unchanged."
          } >> "$GITHUB_STEP_SUMMARY"
