<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#060d0a" />
    <title>Evermarch App | Tempest Studios</title>
    <link rel="icon" href="%BASE_URL%favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #060d0a;
        overflow-x: hidden;
      }

      #preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #060d0a;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }

      #preloader.fade-out {
        opacity: 0;
        visibility: hidden;
      }

      #preloader img {
        width: 80px;
        height: auto;
        margin-bottom: 28px;
        animation: preloader-float 2.5s ease-in-out infinite;
        filter: drop-shadow(0 0 20px rgba(52, 211, 153, 0.3));
      }

      #preloader .preloader-bar-track {
        width: 200px;
        height: 3px;
        margin-bottom: 20px;
        overflow: hidden;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.06);
      }

      #preloader .preloader-bar-fill {
        width: 30%;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #059669, #6ee7b7, #059669);
        animation: preloader-slide 1.4s ease-in-out infinite;
      }

      #preloader .preloader-text {
        color: rgba(255, 255, 255, 0.25);
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 11px;
        letter-spacing: 3px;
        text-transform: uppercase;
      }

      @keyframes preloader-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      @keyframes preloader-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(700%); }
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <img src="%BASE_URL%Tempest_Studios.png" alt="Tempest Studios" />
      <div class="preloader-bar-track">
        <div class="preloader-bar-fill"></div>
      </div>
      <span class="preloader-text">Loading</span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
